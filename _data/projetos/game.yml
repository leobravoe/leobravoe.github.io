  - id: data-guilda
    ano: 2022
    secao: gameplay
    titulo:
      pt: "Data Guida"
      en: "Data Guida"
    links:
      - chave: tcc
        href: "/portfolio/game/tcc/tcc-data_guilda-2022.pdf"
      - chave: download_windows
        href: "https://drive.google.com/file/d/1w5_FMQlry9JskA4o8dUhBucetE8PEG5b/view?usp=sharing"
    texto:
      pt:
        - >-
          O jogo apresenta um gameplay de RPG 2D com exploração em ambiente interno,
          interação com NPCs, leitura de diálogos, coleta de informações, uso de interfaces
          interativas e resolução de desafios em SQL como parte central da progressão. O
          jogador controla Guida em uma empresa dividida em setores, podendo circular pelo
          mapa, conversar com personagens, utilizar computadores para consultar tabelas,
          acessar livros com conteúdo introdutório de SQL e consultar o sistema “Boogli”,
          que amplia as informações narrativas do universo do jogo. Assim, a jogabilidade
          combina investigação narrativa, progressão por missões e prática de comandos de
          banco de dados em uma estrutura voltada ao aprendizado ativo.
      en:
        - >-
            A 2D RPG set indoors, built around exploring, talking to NPCs, reading dialogue,
            gathering information, using interactive interfaces and solving SQL challenges
            as the core of its progression. The player controls Guida inside a company split
            into departments, moving around the map, talking to characters, using computers
            to query tables, reading books with introductory SQL material and consulting the
            “Boogli” system, which fills in the narrative background of the game world.
            Gameplay therefore combines narrative investigation, quest-based progression and
            practice with database commands, in a structure aimed at active learning.
