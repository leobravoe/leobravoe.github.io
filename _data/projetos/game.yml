  - id: carpilator
    ano: 2022
    secao: gameplay
    titulo:
      pt: "Carpilator"
      en: "Carpilator"
    links:
      - chave: tcc
        href: "/portfolio/game/tcc/tcc-carpilator-2022.pdf"
      - chave: download_windows
        href: "https://drive.google.com/file/d/1PG_eHfqlE8505ycaVppPoRB1P4IANDw9/view?usp=sharing"
    texto:
      pt:
        - >-
          O jogo apresenta um gameplay educativo de lógica e simulação de execução de
          código, no qual o jogador acompanha visualmente o comportamento de estruturas
          básicas de programação por meio de um carro que percorre uma estrada organizada
          como representação do fluxo de um algoritmo. A proposta é dividida em dois modos
          principais: no modo user-only, o jogador deve identificar quais entradas precisam
          ser fornecidas para que o programa alcance o resultado esperado; já no modo code,
          o jogador precisa escrever um código capaz de gerar uma cena equivalente à
          apresentada pelo nível. Durante a execução, elementos do cenário representam
          comandos e estruturas da programação, como desvios para condicionais, rotatórias
          para laços de repetição, acostamentos para leitura de dados e placas para exibição
          de informações, permitindo que o estudante visualize de forma concreta o
          encadeamento lógico do programa. Dessa forma, a jogabilidade combina interpretação
          de código, resolução de problemas, interação com entradas de dados e observação
          gráfica do fluxo algorítmico, buscando tornar mais compreensíveis os conceitos
          introdutórios de programação.
      en:
        - >-
            An educational game about logic and the simulated execution of code, in which
            the player watches the behaviour of basic programming constructs through a car
            driving along a road laid out as the flow of an algorithm. There are two main
            modes: in user-only mode the player has to work out which inputs are needed for
            the program to reach the expected result; in code mode the player has to write
            code that produces a scene equivalent to the one the level shows. While the
            program runs, elements of the scenery stand for commands and constructs &mdash;
            forks for conditionals, roundabouts for loops, laybys for reading data and road
            signs for displaying information &mdash; so the student can see the logical
            chaining of the program concretely. Gameplay therefore combines reading code,
            problem solving, feeding in data and watching the algorithm flow graphically,
            aiming to make introductory programming concepts easier to grasp.
