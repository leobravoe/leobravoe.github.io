  - id: vaporr
    ano: 2022
    secao: gameplay
    titulo:
      pt: "VaporR"
      en: "VaporR"
    links:
      - chave: tcc
        href: "/portfolio/game/tcc/tcc-vaporr-2022.pdf"
      - chave: download_windows
        href: "https://drive.google.com/file/d/1bwfUCxPPwUoeczL91HFYnlOdI1To509c/view?usp=sharing"
      - chave: download_android
        href: "https://drive.google.com/file/d/1BO0fGXR23cQzGtqLthDx_wp9ohtqVP7U/view?usp=sharing"
    texto:
      pt:
        - >-
          O jogo apresenta um gameplay de ritmo com elementos de condução em pista, no qual
          o jogador controla um veículo em um cenário 3D dividido em quatro faixas,
          realizando deslocamentos laterais para coletar pontos e desviar de obstáculos ao
          longo do percurso. A progressão da partida ocorre em sincronia com a música de
          fundo, já que os elementos interativos da pista são gerados a partir da análise em
          tempo real do espectro sonoro, incluindo a detecção de batidas e variações de tom.
          Dessa forma, a experiência de jogo combina reflexos, percepção rítmica e
          coordenação motora, enquanto o jogador acompanha o fluxo musical em uma dinâmica
          contínua de pontuação e desvio de colisões.
      en:
        - >-
            A rhythm game with track-driving elements, in which the player steers a vehicle
            through a 3D scene split into four lanes, moving sideways to collect points and
            dodge obstacles along the way. The run progresses in sync with the background
            music, since the interactive elements of the track are generated from real-time
            analysis of the sound spectrum, including beat detection and changes in pitch.
            The experience therefore combines reflexes, a sense of rhythm and motor
            coordination, as the player follows the flow of the music in a continuous loop
            of scoring and avoiding collisions.
