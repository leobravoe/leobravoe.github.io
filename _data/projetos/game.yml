  - id: ia_personagens_2d
    ano: 2023
    secao: objetivo
    titulo:
      pt: "Geração de Arte de Personagens 2D em Jogos Eletrônicos Através de Inteligência Artificial"
      en: "Generating 2D Character Art for Video Games with Artificial Intelligence"
    titulo_curto:
      pt: "Personagens 2D por IA"
      en: "2D Characters with AI"
    links:
      - chave: tcc
        href: "/portfolio/game/tcc/tcc-ia_personagens_2d-2023.pdf"
    texto:
      pt:
        - >-
          Integrar avanços na geração de imagens com modelos de difusão no desenvolvimento
          de arte de personagens 2D para jogos eletrônicos. A proposta é explorar o uso de
          inteligência artificial na geração de arte, com foco na representação de
          personagens, visando reduzir a intervenção humana e, por conseguinte, os custos de
          desenvolvimento. É importante destacar que este projeto não visa criar novos
          modelos ou algoritmos de inteligência artificial, mas sim utilizar tecnologias já
          existentes nesse campo.
      en:
        - >-
            Bring advances in image generation with diffusion models into the production of
            2D character art for video games. The proposal explores the use of artificial
            intelligence to generate art, focusing on character representation, in order to
            reduce human intervention and therefore development costs. It is worth stressing
            that this project does not set out to create new artificial intelligence models
            or algorithms, but to use technologies that already exist in the field.
