# Gerado a partir do HTML original. Os campos "pt" sao o texto que ja estava
# no site; o campo "en" de cada um e adicionado na traducao.
projetos:
  - id: resquicio
    ano: 2024
    secao: gameplay
    titulo:
      pt: "Resquício: Jogo para Introdução à Programação"
      en: "Resquício: A Game for Introductory Programming"
    titulo_curto:
      pt: "Resquício"
      en: "Resquício"
    links:
      - chave: tcc
        href: "/portfolio/game/tcc/tcc-resquicio-2024.pdf"
    texto:
      pt:
        - >-
          O jogo apresenta um RPG tridimensional com câmera em terceira pessoa, no qual o
          jogador assume o papel de um Técnico de Reparo recém-formado e enviado a uma vila
          remota, ambientada em um mundo que se reconstrói após uma guerra nuclear. A
          movimentação é feita pelas teclas W, A, S e D, com saltos pela barra de espaço e
          interação com personagens e objetos pela tecla F, enquanto o mouse controla a
          câmera. A mecânica central está na resolução de exercícios de programação: ao
          interagir com os objetos danificados da era pré-guerra, o jogador abre um editor
          de código integrado e precisa escrever trechos em linguagem Lua para consertar os
          equipamentos e avançar nas missões. Os desafios cobrem conceitos iniciais da
          disciplina de Introdução à Programação, como operações aritméticas, estruturas
          condicionais e laços de repetição. A progressão combina exploração do cenário,
          diálogos com os aldeões e a resolução dos exercícios, de modo que o domínio dos
          conceitos de programação conduz a narrativa e a conquista da confiança dos
          moradores. O projeto foi desenvolvido na Godot Engine com GDScript, com modelagem
          3D em estilo low poly feita no Blender.
      en:
        - >-
            A third-person 3D RPG in which the player takes on the role of a newly graduated
            Repair Technician sent to a remote village, set in a world rebuilding itself
            after a nuclear war. Movement uses the W, A, S and D keys, jumping uses the
            space bar and interaction with characters and objects uses the F key, while the
            mouse controls the camera. The core mechanic is solving programming exercises:
            on interacting with damaged pre-war objects, the player opens a built-in code
            editor and has to write snippets in Lua to repair the equipment and move through
            the quests. The challenges cover the opening topics of an introductory
            programming course, such as arithmetic operations, conditionals and loops.
            Progression combines exploring the scenery, talking to the villagers and solving
            the exercises, so that mastering the programming concepts is what drives the
            narrative and earns the trust of the residents. The project was built in the
            Godot Engine with GDScript, with low poly 3D modelling done in Blender.
