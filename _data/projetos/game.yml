  - id: lab-curie
    ano: 2018
    secao: gameplay
    titulo:
      pt: "Laboratório Curie"
      en: "Laboratório Curie"
    links:
      - chave: tcc
        href: "/portfolio/game/tcc/tcc-lab_curie-2018.pdf"
      - chave: download_windows
        href: "https://drive.google.com/file/d/1ftcgoLgkYLFt3cie9UMcOYNLVSrIeXNx/view?usp=sharing"
      - chave: download_android
        href: "https://drive.google.com/file/d/1-AoJby3sm_hk6eVW7Xx0CS6SEq5_-nVu/view?usp=sharing"
    texto:
      pt:
        - >-
          O jogo apresenta um gameplay educativo de exploração e interação em ambiente
          tridimensional, no qual o jogador controla a personagem Marie Curie dentro de um
          laboratório de química com perspectiva isométrica e comandos por toque em tela. A
          dinâmica principal envolve deslocar a personagem pelo cenário, aproximar-se dos
          objetos, coletar e utilizar itens, além de gerenciar um inventário, simulando de
          forma virtual ações ligadas às práticas laboratoriais. O projeto também prevê a
          criação de novos itens a partir da combinação de elementos já existentes e fases
          voltadas ao uso correto de equipamentos de segurança, fazendo com que a progressão
          esteja associada à execução de atividades práticas e ao aprendizado do uso
          adequado de materiais e instrumentos de laboratório. Dessa forma, a jogabilidade
          combina exploração espacial, manipulação de objetos, interação tátil e
          aprendizagem aplicada, buscando reproduzir, de maneira lúdica e acessível, a
          experiência de um laboratório real.
      en:
        - >-
            An educational game about exploring and interacting in a 3D environment, in
            which the player controls Marie Curie inside a chemistry laboratory, in
            isometric perspective and with touch controls. The main loop involves moving the
            character around the scene, approaching objects, collecting and using items and
            managing an inventory, virtually simulating actions tied to laboratory practice.
            The project also covers creating new items by combining existing ones, and
            levels about the correct use of safety equipment, so that progression is tied to
            carrying out practical activities and learning the proper use of laboratory
            materials and instruments. Gameplay therefore combines spatial exploration,
            object handling, touch interaction and applied learning, seeking to reproduce
            the experience of a real laboratory in a playful and accessible way.
