  - id: restaurantedelivery
    ano: 2019
    slug: restaurante-delivery
    secao: objetivo
    titulo:
      pt: "Restaurante Delivery"
      en: "Restaurante Delivery"
    texto:
      pt:
        - >-
          Ensinar o framework PHP Laravel por meio do desenvolvimento de um projeto real de
          delivery para restaurante. O sistema contará com autenticação para dois tipos de
          usuários (cliente e administrador) e funcionalidades completas de gerenciamento de
          pedidos e cardápio. As interfaces serão construídas com Bootstrap e jQuery,
          garantindo um visual moderno e responsivo. O objetivo é oferecer uma experiência
          prática e abrangente, cobrindo todas as etapas: desde a configuração do ambiente
          de desenvolvimento até a publicação da aplicação em um servidor de produção.
      en:
        - >-
            Teach the PHP framework Laravel by building a real restaurant delivery project.
            The system has authentication for two kinds of user (customer and administrator)
            and full management of orders and menu. The interfaces are built with Bootstrap
            and jQuery, for a modern and responsive look. The aim is a practical, end-to-end
            experience, covering every stage: from setting up the development environment to
            deploying the application to a production server.
