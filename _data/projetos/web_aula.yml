# Gerado a partir do HTML original. Os campos "pt" sao o texto que ja estava
# no site; o campo "en" de cada um e adicionado na traducao.
projetos:
  - id: portal_bcc
    ano: 2024
    slug: site-bcc-ifsc
    secao: objetivo
    titulo:
      pt: "Site BCC IFSC"
      en: "Site BCC IFSC"
    texto:
      pt:
        - >-
          Ensinar a análise e o desenvolvimento do Portal de Notícias do Curso de Ciência da
          Computação do Instituto Federal de Santa Catarina (IFSC), Câmpus Lages. Essa
          plataforma digital tem como objetivo central oferecer um espaço informativo com as
          últimas notícias, avanços e conquistas do curso. O portal funciona como um recurso
          essencial para estudantes, servidores e o público externo, reunindo informações
          sobre eventos acadêmicos, oportunidades de pesquisa e atividades
          extracurriculares.
        - >-
          O projeto é desenvolvido com Node.js, utilizando os pacotes csurf, Express,
          express-session, express-validator, hbs, method-override, mysql e nodemon,
          adotando uma arquitetura em camadas MVC. Inclui a implementação de sistemas de
          autenticação e autorização, proteção contra CSRF, validação de dados,
          gerenciamento de sessões e integração com o banco de dados MySQL, proporcionando
          uma aplicação segura e bem estruturada para o gerenciamento de conteúdos do
          portal.
      en:
        - >-
            Teach the analysis and development of the news portal of the Computer Science
            programme at the Federal Institute of Santa Catarina (IFSC), Lages Campus. The
            main purpose of the platform is to offer a space with the latest news,
            developments and achievements of the programme. The portal works as a key
            resource for students, staff and the wider public, gathering information about
            academic events, research opportunities and extracurricular activities.
        - >-
            The project is built with Node.js, using the csurf, Express, express-session,
            express-validator, hbs, method-override, mysql and nodemon packages, in a
            layered MVC architecture. It covers authentication and authorisation, CSRF
            protection, data validation, session management and integration with a MySQL
            database, resulting in a secure and well structured application for managing the
            portal content.
