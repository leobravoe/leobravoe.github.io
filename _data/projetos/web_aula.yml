  - id: fornattosystem
    ano: 2023
    slug: fornatto-system
    secao: objetivo
    titulo:
      pt: "Fornatto System 2.0"
      en: "Fornatto System 2.0"
    texto:
      pt:
        - >-
          Ensinar Node.js aplicando os pacotes csurf, Express, express-session,
          express-validator, hbs, method-override, mysql e nodemon no desenvolvimento
          back-end de um projeto real para uma pizzaria presencial, adotando a arquitetura
          em camadas MVC. O projeto abordará a implementação de sistemas de autenticação e
          autorização, proteção contra CSRF, validação de dados, gerenciamento de sessões e
          integração com um banco de dados MySQL.
        - >-
          Ensinar React.js utilizando os pacotes font-awesome, react-bootstrap, react-redux
          e react-router-dom no desenvolvimento front-end de um projeto real para uma
          pizzaria presencial, com uma arquitetura baseada em componentes. O curso inclui a
          criação de uma interface moderna e responsiva, gerenciamento de estado global com
          Redux, navegação entre páginas com React Router e integração completa com a API do
          back-end.
      en:
        - >-
            Teach Node.js by applying the csurf, Express, express-session,
            express-validator, hbs, method-override, mysql and nodemon packages to the back
            end of a real project for a dine-in pizzeria, in a layered MVC architecture. The
            project covers authentication and authorisation, CSRF protection, data
            validation, session management and integration with a MySQL database.
        - >-
            Teach React.js using the font-awesome, react-bootstrap, react-redux and
            react-router-dom packages on the front end of a real project for a dine-in
            pizzeria, in a component-based architecture. The course covers building a
            modern, responsive interface, global state management with Redux, navigation
            with React Router and full integration with the back-end API.
