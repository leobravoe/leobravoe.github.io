      - arquivo: img2.webp
        legenda:
          pt: "Telas do módulo de materiais de apoio: lista de tópicos e conteúdos de lógica"
          en: "Support material module: list of topics and the logic content"
      - arquivo: img3.webp
        legenda:
          pt: "Telas do módulo de salas: criação, controle da partida e ranking dos participantes"
          en: "Rooms module: creating a room, running the match and the player ranking"
  - id: booklist
    ano: 2023
    slug: booklist
    academico:
      tipo: tcc
      titulo: "BookList: Sistema Web para Organização e Controle de Leituras"
      autores:
        - "Victor H. Muniz"
        - "Jayme Rebula Klein P. Silva"
        - "Leonardo Bravo Estácio"
      instituicao: "Instituto Federal de Educação, Ciência e Tecnologia de Santa Catarina (IFSC) — Câmpus Lages"
      curso: "Bacharelado em Ciência da Computação"
    secao: objetivo
    titulo:
      pt: "BookList"
      en: "BookList"
    links:
      - chave: tcc
        href: "/portfolio/web/tcc/tcc-booklist-2023.pdf"
    texto:
      pt:
        - >-
          Desenvolver um sistema web que forneça um controle sobre leituras planejadas, em
          andamento e já finalizadas, junto com suas respectivas classificações e opiniões,
          com foco na competição entre os usuários da plataforma, utilizando elementos de
          gamificação para gerar competitividade e sociabilidade. Além disso, notificar
          usuários sobre o lançamento de continuações para leituras que já realizaram.
      en:
        - >-
            Build a web system to keep track of planned, ongoing and finished reading, along
            with the respective ratings and reviews, focused on competition between the
            users of the platform and using gamification to encourage both rivalry and
            sociability. It also notifies users when a sequel comes out for something they
            have already read.
    carrossel: booklist
