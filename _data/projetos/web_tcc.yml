  - id: atendimento-psicologico
    ano: 2023
    slug: atendimento-psicologico
    academico:
      tipo: tcc
      titulo: "Protótipo de Sistema de Atendimento Psicológico para o Instituto Federal de Santa Catarina Câmpus Lages"
      autores:
        - "Carla N. S. Ramos"
        - "Jaqueline C. de Oliveira"
        - "Fábio A. Sperotto"
        - "Leonardo Bravo Estácio"
      instituicao: "Instituto Federal de Educação, Ciência e Tecnologia de Santa Catarina (IFSC) — Câmpus Lages"
      curso: "Bacharelado em Ciência da Computação"
    secao: objetivo
    titulo:
      pt: "Sistema de Atendimento Psicológico"
      en: "Psychological Care System"
    titulo_curto:
      pt: "Atendimento Psicológico"
      en: "Psychological Care"
    links:
      - chave: tcc
        href: "/portfolio/web/tcc/tcc-atendimento_psicologico-2023.pdf"
    texto:
      pt:
        - >-
          Desenvolver um protótipo de sistema para o agendamento dos atendimentos
          psicológicos do IFSC, Câmpus Lages, no lugar do formulário eletrônico usado até
          então, cuja dificuldade estava em transformar as respostas em planilhas. O
          sistema reúne o cadastro de alunos e servidores, a solicitação e a confirmação
          dos atendimentos, o envio de e-mails e a geração de relatórios, e foi construído
          em PHP com o framework Laravel.
      en:
        - >-
          Build a prototype system for scheduling the psychological care appointments at
          IFSC, Lages Campus, replacing the online form used until then, whose weak point
          was turning the answers into spreadsheets. The system brings together student
          and staff registration, requesting and confirming appointments, sending e-mails
          and generating reports, and was built in PHP with the Laravel framework.
    carrossel: atendimento-psicologico
    pasta: "/portfolio/web/tcc/img-atendimento_psicologico-2023"
