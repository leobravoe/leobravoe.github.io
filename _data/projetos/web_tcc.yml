projetos:
  - id: discmath
    ano: 2025
    slug: discmath
    academico:
      tipo: tcc
      titulo: "DiscMath: um Aplicativo Educacional para o Ensino de Conteúdos de Matemática Discreta"
      autores:
        - "Caio Picinini Pagliosa"
        - "Eduardo Moreira de Jesus"
        - "Vilma Gisele Karsburg"
        - "Leonardo Bravo Estácio"
      instituicao: "Instituto Federal de Educação, Ciência e Tecnologia de Santa Catarina (IFSC) — Câmpus Lages"
      curso: "Bacharelado em Ciência da Computação"
    secao: objetivo
    titulo:
      pt: "DiscMath"
      en: "DiscMath"
    links:
      - chave: tcc
        href: "/portfolio/web/tcc/tcc-discmath-2025.pdf"
    texto:
      pt:
        - >-
          Desenvolver um aplicativo móvel de apoio ao estudo de Matemática Discreta no
          ensino superior, reunindo um módulo de quizzes com questões do POSCOMP e outras
          geradas por inteligência artificial, um módulo de materiais de apoio e um modo
          multijogador que incentiva o estudo colaborativo.
      en:
        - >-
            Build a mobile application to support the study of Discrete Mathematics in
            higher education, bringing together a quiz module with questions from the
            POSCOMP exam and others generated by artificial intelligence, a support material
            module and a multiplayer mode that encourages collaborative study.
    carrossel: discmath
    pasta: "/portfolio/web/tcc/img-discmath-2025"
    largura: 1280
