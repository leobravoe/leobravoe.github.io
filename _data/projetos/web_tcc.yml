  - id: mudancafacil
    ano: 2020
    secao: objetivo
    titulo:
      pt: "Mudança Fácil"
      en: "Mudança Fácil"
    links:
      - chave: tcc
        href: "/portfolio/web/tcc/tcc-mudancafacil-2020.pdf"
    texto:
      pt:
        - >-
          Desenvolver um sistema de locação de imóveis no qual os locadores possam cadastrar
          as informações relevantes sobre seus imóveis e os interessados em alugar possam
          visualizá-las.
      en:
        - >-
            Build a property rental system in which landlords can register the relevant
            information about their properties and prospective tenants can browse it.
