# Gerado a partir do HTML original. Os campos "pt" sao o texto que ja estava
# no site; o campo "en" de cada um e adicionado na traducao.
projetos:
  - id: discmath
    ano: 2025
    secao: objetivo
    titulo:
      pt: "DiscMath"
      en: "DiscMath"
    links:
      - chave: tcc
        href: "/portfolio/web/tcc/tcc-discmath-2025.pdf"
    texto:
      pt:
        - >-
          Desenvolver um aplicativo móvel de apoio ao estudo de Matemática Discreta no
          ensino superior, reunindo um módulo de quizzes com questões do POSCOMP e outras
          geradas por inteligência artificial, um módulo de materiais de apoio e um modo
          multijogador que incentiva o estudo colaborativo.
      en:
        - >-
            Build a mobile application to support the study of Discrete Mathematics in
            higher education, bringing together a quiz module with questions from the
            POSCOMP exam and others generated by artificial intelligence, a support material
            module and a multiplayer mode that encourages collaborative study.
    carrossel: discmath
    pasta: "/portfolio/web/tcc/img-discmath-2025"
    largura: 1280
    altura: 876
    legenda_classe: "bg-dark bg-opacity-50 text-white"
    imagens:
      - arquivo: img0.webp
        legenda:
          pt: "Telas do módulo de login: boas-vindas, autenticação com Google e menu principal"
          en: "Login module: welcome, Google sign-in and main menu"
      - arquivo: img1.webp
        legenda:
          pt: "Telas do módulo de quiz: histórico, questão em andamento e resultado"
          en: "Quiz module: history, a question in progress and the result"
      - arquivo: img2.webp
        legenda:
          pt: "Telas do módulo de materiais de apoio: lista de tópicos e conteúdos de lógica"
          en: "Support material module: list of topics and the logic content"
      - arquivo: img3.webp
        legenda:
          pt: "Telas do módulo de salas: criação, controle da partida e ranking dos participantes"
          en: "Rooms module: creating a room, running the match and the player ranking"
  - id: booklist
    ano: 2023
    secao: objetivo
    titulo:
      pt: "BookList"
      en: "BookList"
    links:
      - chave: tcc
        href: "/portfolio/web/tcc/tcc-booklist-2023.pdf"
    texto:
      pt:
        - >-
          Desenvolver um sistema web que forneça um controle sobre leituras planejadas, em
          andamento e já finalizadas, junto com suas respectivas classificações e opiniões,
          com foco na competição entre os usuários da plataforma, utilizando elementos de
          gamificação para gerar competitividade e sociabilidade. Além disso, notificar
          usuários sobre o lançamento de continuações para leituras que já realizaram.
      en:
        - >-
            Build a web system to keep track of planned, ongoing and finished reading, along
            with the respective ratings and reviews, focused on competition between the
            users of the platform and using gamification to encourage both rivalry and
            sociability. It also notifies users when a sequel comes out for something they
            have already read.
    carrossel: booklist
    pasta: "/portfolio/web/tcc/img-booklist-2023"
