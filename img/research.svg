<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
    role="img" aria-label="Pesquisa acadêmica">
    <defs>
        <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f766e" />
            <stop offset="1" stop-color="#065f52" />
        </linearGradient>
        <linearGradient id="liquido" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5eead4" />
            <stop offset="1" stop-color="#2dd4bf" />
        </linearGradient>
        <clipPath id="quadro">
            <rect width="256" height="256" />
        </clipPath>
        <clipPath id="dentro-do-frasco">
            <path d="M113 64v34l-49 88a12 12 0 0 0 10 18h108a12 12 0 0 0 10-18l-49-88V64z" />
        </clipPath>
    </defs>

    <g clip-path="url(#quadro)">
        <rect width="256" height="256" fill="url(#fundo)" />

        <!-- manchas de fundo, para a arte nao ficar chapada -->
        <circle cx="26" cy="30" r="62" fill="#14b8a6" opacity=".22" />
        <circle cx="236" cy="206" r="54" fill="#14b8a6" opacity=".18" />
        <circle cx="214" cy="40" r="30" fill="#5eead4" opacity=".12" />

        <!-- gráfico de resultados, atrás do frasco -->
        <g opacity=".65" fill="none" stroke="#a7f3d0" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M34 92h0M34 60v56h56" opacity=".55" />
            <path d="M42 104l16-18 16 10 18-30" />
        </g>
        <g fill="#a7f3d0" opacity=".85">
            <circle cx="42" cy="104" r="4.5" />
            <circle cx="58" cy="86" r="4.5" />
            <circle cx="74" cy="96" r="4.5" />
            <circle cx="92" cy="66" r="4.5" />
        </g>

        <ellipse cx="128" cy="206" rx="78" ry="12" fill="#042f2a" opacity=".3" />

        <!-- frasco -->
        <g stroke="#ffffff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
            <path d="M113 64v34l-49 88a12 12 0 0 0 10 18h108a12 12 0 0 0 10-18l-49-88V64z"
                fill="#0b4f45" />
            <g clip-path="url(#dentro-do-frasco)" stroke="none">
                <path d="M24 164c20-12 34 10 54 0s30-12 50-2 34 2 56-9l48-11V240H24z"
                    fill="url(#liquido)" />
                <circle cx="104" cy="186" r="9" fill="#ffffff" opacity=".45" />
                <circle cx="140" cy="176" r="6" fill="#ffffff" opacity=".4" />
                <circle cx="158" cy="194" r="7" fill="#ffffff" opacity=".35" />
                <circle cx="120" cy="202" r="5" fill="#ffffff" opacity=".3" />
            </g>
            <path d="M113 64v34l-49 88a12 12 0 0 0 10 18h108a12 12 0 0 0 10-18l-49-88V64z"
                fill="none" />
            <rect x="104" y="48" width="48" height="18" rx="9" fill="#ffffff" />
        </g>

        <!-- vapor saindo da boca do frasco -->
        <g fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity=".75">
            <path d="M118 40c-6-7 6-13 0-20" />
            <path d="M140 36c-6-7 6-13 0-18" />
        </g>
    </g>
</svg>
