      <circle cx="146" cy="130" r="9" fill="#ef5b5b"/>
      <!-- metade esquerda ainda em resolucao grosseira -->
      <g fill="#0a3f52" opacity=".45">
        <rect x="79" y="59" width="98" height="4"/>
        <rect x="79" y="73" width="98" height="4"/>
        <rect x="79" y="87" width="98" height="4"/>
        <rect x="79" y="101" width="98" height="4"/>
        <rect x="79" y="115" width="98" height="4"/>
        <rect x="79" y="129" width="98" height="4"/>
        <rect x="79" y="143" width="98" height="4"/>
      </g>
      <!-- linha de varredura -->
      <path d="M79 119 h98" stroke="#ffd37a" stroke-width="5" opacity=".95"/>
    </g>
    <circle cx="128" cy="108" r="49" fill="none" stroke="#06302a" stroke-width="5"/>

    <!-- chip / GPU : processamento paralelo -->
    <g>
      <g stroke="#06302a" stroke-width="5" stroke-linecap="round">
        <path d="M30 196v-9M44 196v-9M58 196v-9"/>
        <path d="M30 238v9M44 238v9M58 238v9"/>
        <path d="M22 204h-9M22 217h-9M22 230h-9"/>
        <path d="M66 204h9M66 217h9M66 230h9"/>
      </g>
      <rect x="18" y="192" width="52" height="50" rx="9" fill="#f4f1e4" stroke="#06302a" stroke-width="5"/>
      <g fill="#0e8a74">
        <rect x="27" y="201" width="13" height="13" rx="2.5"/>
        <rect x="48" y="201" width="13" height="13" rx="2.5"/>
        <rect x="27" y="220" width="13" height="13" rx="2.5"/>
        <rect x="48" y="220" width="13" height="13" rx="2.5"/>
      </g>
    </g>

    <!-- grafico de convergencia -->
    <g>
      <rect x="152" y="192" width="86" height="50" rx="9" fill="#f4f1e4" stroke="#06302a" stroke-width="5"/>
      <path d="M163 203v28h64" fill="none" stroke="#06302a" stroke-width="4" stroke-linecap="round"/>
      <path d="M165 205 C 181 205, 186 226, 227 229" fill="none" stroke="#ef5b5b"
