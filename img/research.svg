    <!-- parametro lambda -->
    <g>
      <circle cx="216" cy="40" r="22" fill="#ffd37a" stroke="#06302a" stroke-width="5"/>
      <path d="M207 29 c6 0 8 3 10 9 l5 14 M222 36 l-13 16" fill="none" stroke="#06302a"
