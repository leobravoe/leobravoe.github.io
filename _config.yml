# Codigos de verificacao. Vazio = a meta tag nao e gerada.
# Google Search Console: so o valor de content da meta tag google-site-verification.
# Bing Webmaster Tools: so o valor de content da meta tag msvalidate.01.
verificacao:
  google: ""
  bing: ""

# Codigo do GoatCounter (o "xxx" de xxx.goatcounter.com). Vazio = sem analytics.
goatcounter: ""

# Chave do IndexNow. O arquivo com o mesmo nome (.txt) fica na raiz do site, e o
# workflow de deploy usa a chave para avisar Bing e cia. a cada publicacao.
indexnow_key: 619e90f27a33141c4737a7618c3882f2

# O site é HTML puro: nada de Markdown, plugins ou coleções (o sitemap é feito
# em Liquid).
plugins: []

exclude:
