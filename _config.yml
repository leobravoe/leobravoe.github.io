# Idiomas do site. O primeiro e o padrao e fica na raiz; os outros ganham prefixo.
# "og_imagem" e a previa de compartilhamento (1200x630) de cada idioma.
idiomas:
  - codigo: pt
    nome: Português
    sigla: BR
    html: pt-br
    og: pt_BR
    bandeira: br
    prefixo: ""
    og_imagem: /img/og-pt.png
  - codigo: en
    nome: English
    sigla: EN
    html: en
    og: en_US
    bandeira: us
    prefixo: /en
    og_imagem: /img/og-en.png

# Dados da pessoa, usados no JSON-LD (Person/ProfilePage) e na barra lateral.
# Perfis com valor vazio nao aparecem em lugar nenhum: basta preencher para
# o link entrar na barra lateral e no "sameAs" do JSON-LD.
pessoa:
  nome: Leonardo Bravo Estácio
  primeiro_nome: Leonardo
  sobrenome: Bravo Estácio
  email: leonardo.bravo@ifsc.edu.br
  foto: /img/foto_200.png
  cargo:
    pt: Professor EBTT de Computação
    en: Computing Professor (EBTT)
  instituicao:
    nome: Instituto Federal de Santa Catarina (IFSC) — Câmpus Gaspar
    url: https://www.ifsc.edu.br/web/campus-gaspar
  formacao:
    - nome: Universidade de São Paulo (USP)
      url: https://www.usp.br
    - nome: Centro Universitário da Grande Dourados (UNIGRAN)
      url: https://www.unigran.br
  conhecimentos:
    - Desenvolvimento web
    - Avaliação de desempenho de APIs
    - Jogos digitais
    - Tecnologias educacionais
    - Computação paralela
    - Reconstrução tomográfica
  lattes: https://lattes.cnpq.br/4699243034581879
  github: https://github.com/leobravoe
  youtube: https://www.youtube.com/channel/UCC_GXrZvsc5w--L4bhdxIFQ
  instagram: https://www.instagram.com/leobravoe
  # Preencher com o endereco completo do perfil, por exemplo
  # https://orcid.org/0000-0000-0000-0000
