    <!-- Conexões antecipadas com as CDNs -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <!-- bootstrap CSS (bloqueia a renderização de propósito: é o layout) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Ícones: não bloqueiam a renderização. Carregam como "print" e viram
         "all" quando chegam; sem JavaScript, o <noscript> carrega normal. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
    </noscript>
    <!-- Scripts com defer: baixam em paralelo e rodam na ordem, depois do HTML
         lido, sem travar a primeira pintura. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous" defer></script>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <!-- Dark/Light Config - Variável na LocalStorage -->
    <script>
        (() => {
            const saved = localStorage.getItem('theme');
            const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', saved || (systemDark ? 'dark' : 'light'));
        })();
    </script>
    <style>
        body {
            overflow-y: scroll;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Tira a seleção de foco do botão de dark mode */
        .form-check-input:focus {
            box-shadow: 0 0 0 0 rgba(var(--bs-light-rgb), 0);
        }

        /* tamanho do ícone do knob (ajuste se necessário) */
        [data-bs-theme="dark"] .form-switch .form-check-input {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%236c757d'/%3e%3c/svg%3e");
        }

        /* Trilho (fundo) do switch em azul-info no dark mode */
        [data-bs-theme="dark"] .form-switch .form-check-input {
            /* forçar a cor do trilho */
            background-color: var(--bs-info) !important;
            border-color: var(--bs-info) !important;
        }

        /* Barra do topo a partir de md (>=768px): marca e links no centro,
           tema e idioma à direita.

           Antes esse bloco saía do fluxo com position:absolute, e o conteúdo
           centralizado era medido como se ele não existisse — em larguras
           intermediárias os dois se sobrepunham. Em grid cada um tem a sua
           coluna: quando falta espaço, um empurra o outro em vez de passar
           por cima.

           A primeira coluna fica com todo o espaço que sobra e a marca e os
           links se centralizam dentro dela, então o centro acompanha a largura
           em vez de depender da folga da barra. */
        /* A barra em si nao tem fundo: sao dois paineis, um para a marca e os
           links, outro para tema e idioma. Os dois usam o mesmo arredondamento
           dos cartoes do site; o que separa um do outro e o vao entre eles. */
        .barra-topo {
            padding: 0;
            gap: .75rem;
        }

        @media (min-width: 768px) {
            .barra-topo {
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: stretch;
            }

            .barra-topo > .container-fluid {
                grid-column: 1;
                min-width: 0;
            }

            .barra-topo > .barra-controles {
                grid-column: 2;
                justify-self: end;
            }
        }

        /* Sempre branco — override direto da imagem */
        .carousel .carousel-control-prev-icon,
        .carousel .carousel-control-next-icon {
            filter: none !important;
            /* evita inversões do modo dark/.carousel-dark */
            opacity: 1 !important;
        }

        /* Bandeiras do seletor de idioma: acompanham a fonte do contexto, para
           ficarem da mesma altura do interruptor de tema */
        .bandeira {
            width: 1.4em;
            height: 1em;
            border-radius: .15em;
            flex: none;
        }

        /* .btn fixa a própria fonte; aqui ela herda, para o seletor ficar na
           mesma escala do interruptor de tema, e o menu segue a mesma medida */
        .seletor-idioma .btn,
        .seletor-idioma .dropdown-menu {
            font-size: inherit;
        }

        /* sem isto o botão fica na linha de base do bloco e desce alguns pixels
           em relação aos ícones de lua e sol */
        .seletor-idioma {
            display: flex;
            align-items: center;
        }

        /* Cada imagem do modal mora num quadro do tamanho do modal, e e o quadro
           que desliza. Deslizar a imagem direto nao serve: o translateX de 100%
           anda a largura dela, entao uma imagem mais estreita que a tela ficaria
           com uma parte ainda visivel na lateral. A duracao e a curva sao as
           mesmas do carrossel. */
        #imageModal .quadro-modal {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #imageModal .quadro-modal img {
            max-width: 100%;
            max-height: 100%;
        }

        #imageModal .quadro-modal.desliza {
            transition: transform .6s ease-in-out;
        }

        @media (prefers-reduced-motion: reduce) {
            #imageModal .quadro-modal.desliza {
                transition: none;
            }
        }

        /* Botões de navegação dentro do modal de imagem ampliada */
        #imageModal .carousel-control-prev,
        #imageModal .carousel-control-next {
            opacity: .85;
            z-index: 2;
        }

        #imageModal .carousel-control-prev:hover,
        #imageModal .carousel-control-next:hover,
        #imageModal .carousel-control-prev:focus,
        #imageModal .carousel-control-next:focus {
            opacity: 1;
        }

        #imageModal .carousel-control-prev-icon,
        #imageModal .carousel-control-next-icon {
            filter: none !important;
            opacity: 1 !important;
        }

    /* Legendas do carrossel: sobrepostas no desktop, abaixo da imagem no mobile */
    @media (max-width: 767.98px) {
        .carousel-caption {
            position: static;
            width: 100%;
            padding: .5rem .75rem;
            text-align: left;
        }

        .carousel-caption .legenda-titulo {
            font-size: .95rem;
            margin-bottom: .15rem;
        }

        .carousel-caption p {
            font-size: .8rem;
            margin-bottom: 0;
        }

        .carousel-control-prev,
        .carousel-control-next {
            align-items: flex-start;
            padding-top: 15%;
        }
    }

    /* Cartões das listas de trabalhos: a imagem ocupa a coluna inteira */
    .cartao-trabalho img {
        aspect-ratio: 16 / 9;
        object-fit: cover;
    }

    .cartao-trabalho img.icone {
        object-fit: contain;
    }

    /* Atributos width/height evitam layout shift; height:auto mantem a proporcao */
    .carousel-item img {
        height: auto;
    }
    </style>
